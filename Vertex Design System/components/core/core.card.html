<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Vertex — Core</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:20px;align-items:center}.col{display:flex;flex-direction:column;gap:18px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label);margin-bottom:10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VertexDesignSystem_24ef46;

const { Button, IconButton, Tag, Badge, Card, Logo, Icon } = NS;
function Demo(){return (<div className="col">
  <div><div className="lbl">Button — variants</div><div className="row">
    <Button variant="primary">View the build</Button>
    <Button variant="secondary" iconRight={<Icon name="arrow-right" size={13}/>}>Legacy archive</Button>
    <Button variant="ghost">Cancel</Button>
    <Button variant="alert">Last slot</Button>
    <Button disabled>Sold</Button>
  </div></div>
  <div><div className="lbl">Sizes · icon buttons</div><div className="row">
    <Button size="sm">Small</Button><Button size="md">Medium</Button><Button size="lg">Large</Button>
    <IconButton name="play" label="Play" variant="solid"/>
    <IconButton name="chevron-right" label="Next"/>
    <IconButton name="x" label="Close" variant="ghost"/>
  </div></div>
  <div><div className="lbl">Tag · Badge</div><div className="row">
    <Tag tone="gold">Available</Tag><Tag tone="rare" dot>1 of 1 — Ferrari donor</Tag>
    <Tag tone="neutral" dot>In build</Tag><Tag tone="sold">Sold 2024</Tag>
    <Badge tone="gold">Build #03</Badge><Badge tone="rare">Last slot</Badge><Badge tone="paper">New</Badge>
  </div></div>
  <div><div className="lbl">Card · Logo</div><div className="row" style={{alignItems:'stretch'}}>
    <Card interactive style={{flex:1,minWidth:240}}><div style={{font:'var(--type-body)',color:'var(--text-body)',fontSize:14}}>Graphite panel, 1px blueprint hairline, zero radius, no shadow.</div></Card>
    <Card surface="raised" style={{display:'flex',gap:28,alignItems:'center'}}>
      <Logo variant="lockup" size={22}/><Logo variant="mark" size={30}/><Logo variant="badge" size={18}/>
    </Card>
  </div></div>
</div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
setTimeout(()=>window.lucide&&window.lucide.createIcons(),120);
</script></body></html>
