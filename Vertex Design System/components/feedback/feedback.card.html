<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Vertex — Feedback</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:20px;align-items:center}.col{display:flex;flex-direction:column;gap:18px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label);margin-bottom:10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VertexDesignSystem_24ef46;

const { Dialog, Toast, Tooltip, Button, IconButton } = NS;
function Demo(){
  const [o,setO]=React.useState(false);
  return (<div className="col">
    <div className="row">
      <Button variant="secondary" onClick={()=>setO(true)}>Open dialog</Button>
      <Tooltip label="Cold start audio"><IconButton name="volume-2" label="Play"/></Tooltip>
      <Tooltip label="Add to shortlist" placement="right"><IconButton name="bookmark" label="Save"/></Tooltip>
    </div>
    <div className="row">
      <Toast tone="success" icon="check" message="Enquiry sent"/>
      <Toast tone="alert" icon="triangle-alert" message="Slot unavailable"/>
      <Toast message="Shortlist updated"/>
    </div>
    <div style={{position:'relative',minHeight:150,border:'1px dashed var(--line-faint)'}}>
      <div style={{position:'absolute',inset:0,transform:'scale(0.72)',transformOrigin:'top left',width:'139%',height:'139%'}}>
        <Dialog open={true} eyebrow="Build slot" title="Your request is registered." width={520}
          footer={<Button size="sm" onClick={()=>{}}>Close</Button>}>
          A member of the studio will be in contact within two working days to discuss donor availability.
        </Dialog>
      </div>
    </div>
    <Dialog open={o} eyebrow="Private showroom" title="Confirm your appointment." onClose={()=>setO(false)}
      footer={<><Button size="sm" variant="ghost" onClick={()=>setO(false)}>Cancel</Button><Button size="sm" onClick={()=>setO(false)}>Confirm</Button></>}>
      Thursday 14 March, 10:00 — Studio, Stuttgart.
    </Dialog>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
setTimeout(()=>window.lucide&&window.lucide.createIcons(),120);
</script></body></html>
