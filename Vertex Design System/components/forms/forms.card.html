<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Vertex — Forms</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--surface-page)}.row{display:flex;flex-wrap:wrap;gap:20px;align-items:center}.col{display:flex;flex-direction:column;gap:18px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label);margin-bottom:10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.VertexDesignSystem_24ef46;

const { Input, Textarea, Select, Checkbox, RadioGroup, Switch } = NS;
function Demo(){
  const [v,setV]=React.useState('Commission');const [c,setC]=React.useState(true);const [s,setS]=React.useState(true);
  return (<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:28}}>
    <div className="col">
      <Input label="Full name" required placeholder="Your name"/>
      <Input label="Email" type="email" error="Enter a valid address." defaultValue="not-an-email"/>
      <Select label="Base donor" options={['Porsche 911 (964)','Mercedes-Benz 280 SL','Lamborghini Urraco']}/>
    </div>
    <div className="col">
      <Textarea label="Aesthetic direction" rows={3} placeholder="Paint, leather, exhaust character…"/>
      <RadioGroup label="Enquiry type" name="k" value={v} onChange={setV} layout="row" options={['Available build','Commission','Viewing']}/>
      <div className="row" style={{gap:24}}>
        <Checkbox label="Add me to the register" checked={c} onChange={setC}/>
        <Switch label="Available only" checked={s} onChange={setS}/>
      </div>
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
setTimeout(()=>window.lucide&&window.lucide.createIcons(),120);
</script></body></html>
