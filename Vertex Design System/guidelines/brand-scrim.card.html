<!-- @dsCard group="Brand" viewport="700x200" name="Protection gradients" subtitle="Bottom-up scrim behind any text on imagery" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vertex — Scrims</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label)}.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--paper-dim)}.sw{display:flex;flex-direction:column;gap:8px}.chip{height:64px;border:1px solid var(--line-faint)}.row{display:flex;gap:12px}.row>*{flex:1}</style>
</head><body>
<div style="display:flex;gap:20px">
<div style="flex:1;height:150px;border:1px solid var(--line-structural);background-image:var(--grid-blueprint);position:relative"><div style="position:absolute;inset:0;background:var(--scrim-bottom)"></div><span style="position:absolute;left:14px;bottom:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-white)">--scrim-bottom</span></div>
<div style="flex:1;height:150px;border:1px solid var(--line-structural);background-image:var(--grid-blueprint);position:relative"><div style="position:absolute;inset:0;background:var(--scrim-left)"></div><span style="position:absolute;left:14px;bottom:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-white)">--scrim-left</span></div>
</div></body></html>
