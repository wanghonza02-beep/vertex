<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base unit; blueprint rules always land on it" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vertex — Spacing</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label)}.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--paper-dim)}.sw{display:flex;flex-direction:column;gap:8px}.chip{height:64px;border:1px solid var(--line-faint)}.row{display:flex;gap:12px}.row>*{flex:1}</style>
</head><body>
<div style="display:flex;align-items:flex-end;gap:14px">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:4px;height:4px;background:var(--champagne-gold);opacity:.75"></div><span class="hex">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:8px;height:8px;background:var(--champagne-gold);opacity:.75"></div><span class="hex">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:12px;height:12px;background:var(--champagne-gold);opacity:.75"></div><span class="hex">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:16px;height:16px;background:var(--champagne-gold);opacity:.75"></div><span class="hex">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:24px;height:24px;background:var(--champagne-gold);opacity:.75"></div><span class="hex">24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:32px;height:32px;background:var(--champagne-gold);opacity:.75"></div><span class="hex">32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:48px;height:48px;background:var(--champagne-gold);opacity:.75"></div><span class="hex">48</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:64px;height:64px;background:var(--champagne-gold);opacity:.75"></div><span class="hex">64</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:96px;height:72px;background:var(--champagne-gold);opacity:.75"></div><span class="hex">96</span></div>
</div></body></html>
