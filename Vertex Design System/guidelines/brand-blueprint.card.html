<!-- @dsCard group="Brand" viewport="700x190" name="Blueprint rules & grid" subtitle="Dimension ticks, gold emphasis, faint background grid" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vertex — Blueprint</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label)}.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--paper-dim)}.sw{display:flex;flex-direction:column;gap:8px}.chip{height:64px;border:1px solid var(--line-faint)}.row{display:flex;gap:12px}.row>*{flex:1}</style>
</head><body>
<div style="display:flex;flex-direction:column;gap:24px">
<div style="position:relative;height:1px;background:var(--line-structural)"><span style="position:absolute;left:0;top:-4px;width:1px;height:9px;background:var(--line-structural)"></span><span style="position:absolute;right:0;top:-4px;width:1px;height:9px;background:var(--line-structural)"></span></div>
<div style="height:1px;width:140px;background:var(--champagne-gold)"></div>
<div style="height:96px;border:1px solid var(--line-structural);background-image:var(--grid-blueprint);position:relative"><span style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(46,59,71,.7)"></span><span style="position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(46,59,71,.7)"></span></div>
</div></body></html>
