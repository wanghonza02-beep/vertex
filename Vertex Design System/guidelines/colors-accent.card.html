<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vertex — Accent</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label)}.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--paper-dim)}.sw{display:flex;flex-direction:column;gap:8px}.chip{height:64px;border:1px solid var(--line-faint)}.row{display:flex;gap:12px}.row>*{flex:1}</style>
</head><body><div class="row">
<div class="sw"><div class="chip" style="background:#C9A66B;"></div><div><div class="lbl" style="color:var(--paper-muted)">Champagne Gold</div><div class="hex">#C9A66B</div></div></div><div class="sw"><div class="chip" style="background:#8C7248;"></div><div><div class="lbl" style="color:var(--paper-muted)">Aged Brass</div><div class="hex">#8C7248</div></div></div><div class="sw"><div class="chip" style="background:rgba(201,166,107,0.12);"></div><div><div class="lbl" style="color:var(--paper-muted)">Gold Wash 12%</div><div class="hex">--gold-wash</div></div></div><div class="sw"><div class="chip" style="background:rgba(201,166,107,0.22);"></div><div><div class="lbl" style="color:var(--paper-muted)">Gold Wash 22%</div><div class="hex">--gold-wash-strong</div></div></div>
</div></body></html>
