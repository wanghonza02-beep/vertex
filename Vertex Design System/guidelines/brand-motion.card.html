<!-- @dsCard group="Brand" viewport="700x170" name="Motion tokens" subtitle="Line draw 900ms, count-up 1200ms, controls 160ms" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vertex — Motion</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label)}.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--paper-dim)}.sw{display:flex;flex-direction:column;gap:8px}.chip{height:64px;border:1px solid var(--line-faint)}.row{display:flex;gap:12px}.row>*{flex:1}</style>
</head><body>
<style>@keyframes vxdraw{0%,12%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}</style>
<div style="display:flex;flex-direction:column;gap:18px">
<div><div class="lbl" style="margin-bottom:8px">--duration-draw 900ms · --ease-draw</div><div style="height:1px;background:var(--champagne-gold);transform-origin:left;animation:vxdraw 2.4s infinite"></div></div><div><div class="lbl" style="margin-bottom:8px">--duration-base 260ms · --ease-out-technical</div><div style="height:1px;background:var(--champagne-gold);transform-origin:left;animation:vxdraw 1.4s infinite"></div></div><div><div class="lbl" style="margin-bottom:8px">--duration-fast 160ms · --ease-standard</div><div style="height:1px;background:var(--champagne-gold);transform-origin:left;animation:vxdraw 1s infinite"></div></div>
</div></body></html>
