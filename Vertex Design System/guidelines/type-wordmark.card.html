<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vertex — Wordmark</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label)}.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--paper-dim)}.sw{display:flex;flex-direction:column;gap:8px}.chip{height:64px;border:1px solid var(--line-faint)}.row{display:flex;gap:12px}.row>*{flex:1}</style>
</head><body>
<div style="display:flex;align-items:center;gap:40px">
<span style="font-family:var(--font-luxury);font-size:40px;letter-spacing:.12em;color:var(--paper-white)">VERTEX</span>
<span style="font-family:var(--font-luxury);font-size:24px;letter-spacing:.12em;color:var(--champagne-gold)">VERTEX</span>
<span class="hex">--font-luxury · --tracking-wordmark</span>
</div></body></html>
