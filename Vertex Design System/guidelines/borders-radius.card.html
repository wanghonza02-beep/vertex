<!-- @dsCard group="Spacing" viewport="700x170" name="Corners & borders" subtitle="0px radius everywhere; 1px hairline is the only elevation" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Vertex — Borders</title>
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-page)}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--text-label)}.hex{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--paper-dim)}.sw{display:flex;flex-direction:column;gap:8px}.chip{height:64px;border:1px solid var(--line-faint)}.row{display:flex;gap:12px}.row>*{flex:1}</style>
</head><body>
<div style="display:flex;gap:20px;align-items:stretch">
<div style="flex:1;height:96px;background:var(--graphite);border:1px solid var(--line-structural);display:flex;align-items:flex-end;padding:10px"><span class="hex">--border-rule · radius 0</span></div>
<div style="flex:1;height:96px;background:var(--graphite);border:1px solid var(--champagne-gold);display:flex;align-items:flex-end;padding:10px"><span class="hex">hover / focus</span></div>
<div style="flex:1;height:96px;background:var(--graphite-raised);border:1px solid var(--line-structural);box-shadow:var(--shadow-overlay);display:flex;align-items:flex-end;padding:10px"><span class="hex">--shadow-overlay (dialogs only)</span></div>
</div></body></html>
